name: Deploy Firebase Hosting

# Build bản web và deploy lên Firebase Hosting khi có commit vào main.
# Cần cấu hình trên GitHub:
#   - Secret  FIREBASE_SERVICE_ACCOUNT : JSON service account có quyền Firebase Hosting Admin
#   - Variable FIREBASE_PROJECT_ID     : ID project Firebase (trùng .firebaserc)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: true

jobs:
  deploy:
    name: Build web & deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check Firebase configuration
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          missing=0
          for name in FIREBASE_PROJECT_ID API_BASE_URL; do
            if [[ -z "${!name//[[:space:]]/}" ]]; then
              echo "::warning::Set repository variable $name in Settings > Secrets and variables > Actions > Variables."
              missing=1
            fi
          done
          if (( missing )); then exit 1; fi
          if [[ "$API_BASE_URL" != https://* ]]; then
            echo "::error::API_BASE_URL must be an absolute HTTPS origin."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
      - name: Build web for Firebase
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: flutter build web --release --dart-define="API_BASE_URL=$API_BASE_URL"

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
