# Ví dụ cho nginx chạy trực tiếp trên Ubuntu. Đổi root tới thư mục build/web.
# Web release mặc định gọi /api/v1 trên cùng origin. Với Flutter debug chạy
# local, dùng localhost:8000 hoặc --dart-define=API_BASE_URL=http://localhost:8000.
server {
    listen 80;
    server_name localhost;
    root /srv/ev-sharegrid/build/web;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
